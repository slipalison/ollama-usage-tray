[package]
name = "ollama-usage-tray"
version = "1.0.0"
edition = "2021"
description = "Ollama Cloud usage monitor for the Ubuntu top panel"
license = "MIT"

[dependencies]
ksni = { version = "0.3", features = ["blocking"] }
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fd-lock = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"